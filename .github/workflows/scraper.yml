name: Turkish TV Tracker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ratings and series scrapers
        run: python scraper/main.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit and push changes
        run: |
          git config user.name "ugurbuga"
          git config user.email "47065142+ugurbuga@users.noreply.github.com"
          git add data/weekly_calendar.json data/ratings/ data/tv_series.json data/series_images.json data/youtubevideos/
          git diff --cached --quiet || git commit -m "Update TV tracker data"
          git push
