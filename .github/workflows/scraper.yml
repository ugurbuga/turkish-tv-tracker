name: Turkish TV Tracker

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrapers
        run: python scraper/main.py

      - name: Commit and push changes
        run: |
          git config user.name "ugurbuga"
          git config user.email "47065142+ugurbuga@users.noreply.github.com"
          git add data/series.json data/ratings/
          git diff --cached --quiet || git commit -m "Update TV tracker data"
          git push
